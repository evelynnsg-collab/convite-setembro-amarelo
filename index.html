<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>

<style>
  :root {
    --sol: #FFC928;
    --sol-claro: #FFE680;
    --marinho: #14224A;
    --papel: #FFF8E1;
    color-scheme: light;
  }
  html, body { height: 100%; }
  body {
    background: radial-gradient(120% 80% at 50% 0%, var(--sol-claro), var(--sol) 70%);
    display: grid;
    place-items: center;
    padding-inline: 16px;
    padding-block: 16px;
    box-sizing: border-box;
    font-family: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
    color: var(--marinho);
    overflow: hidden;
  }
  .palco {
    position: relative;
    width: min(100%, calc((100dvh - 32px) * 941 / 1672));
    aspect-ratio: 941 / 1672;
    max-width: 100%;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 18px 50px rgba(20, 34, 74, .35), 0 0 0 3px rgba(255,255,255,.6);
    background: var(--papel);
  }
  .tela {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    user-select: none;
    -webkit-user-drag: none;
  }
  #convite { clip-path: inset(0 0 0 100%); }
  .revelado #convite { clip-path: inset(0 0 0 0); }

  /* Área clicável sobre o botão "CLIQUE AQUI" */
  #clique {
    position: absolute;
    left: 10%; top: 69.8%;
    width: 80.5%; height: 13.6%;
    border: 0; padding: 0;
    background: transparent;
    border-radius: 999px;
    cursor: pointer;
    animation: pulso 1.6s ease-in-out infinite;
  }
  #clique:focus-visible { outline: 4px solid var(--marinho); outline-offset: 4px; }
  @keyframes pulso {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, .0); transform: scale(1); }
    50% { box-shadow: 0 0 0 10px rgba(255, 255, 255, .45); transform: scale(1.02); }
  }
  .saiu #clique { display: none; }

  /* Trem */
  #trem {
    position: absolute;
    top: 50%;
    left: 0;
    height: 19%;
    width: auto;
    transform: translateX(110%);
    pointer-events: none;
    filter: drop-shadow(0 10px 14px rgba(20,34,74,.35));
    will-change: transform;
    z-index: 3;
  }
  #trem svg { height: 100%; width: auto; display: block; }
  .rastro {
    position: absolute; inset: 0; pointer-events: none; z-index: 2;
    opacity: 0;
    background:
      repeating-linear-gradient(0deg, transparent 0 22px, rgba(255,255,255,.55) 22px 24px, transparent 24px 60px);
    mix-blend-mode: screen;
  }
  .passando .rastro { animation: rastro 1.9s ease-out; }
  @keyframes rastro { 0%{opacity:0} 20%{opacity:.7} 100%{opacity:0} }
  .passando .palco-shake { animation: tremor .12s linear 14; }
  @keyframes tremor { 0%,100%{transform:translate(0,0)} 50%{transform:translate(0,1.5px)} }

  #rever {
    position: absolute;
    right: 3.5%; top: 2.4%;
    z-index: 4;
    font: 600 13px/1 "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
    letter-spacing: .02em;
    color: var(--marinho);
    background: rgba(255,255,255,.85);
    border: 2px solid var(--marinho);
    border-radius: 999px;
    padding: 7px 12px 6px;
    cursor: pointer;
    opacity: 0; pointer-events: none;
    transition: opacity .4s ease .3s;
  }
  .revelado #rever { opacity: 1; pointer-events: auto; }
  #rever:focus-visible { outline: 3px solid var(--marinho); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    #clique { animation: none; }
    .passando .palco-shake, .passando .rastro { animation: none; }
  }
</style>

<body>
<main class="palco" id="palco" aria-live="polite">
  <div class="palco-shake" style="position:absolute;inset:0">
    <img class="tela" id="capa" src="capa.jpg" alt="Trivia Trens: Temos um convite pra você! Setembro Amarelo">
    <img class="tela" id="convite" src="convite.jpg" alt="Você foi convidado(a) para a nossa dinâmica do Setembro Amarelo. Amanhã, 13:00h. Local: Sala da supervisão. Conscientização, cuidado e valorização da vida. Sua presença é muito importante para nós!">
  </div>
  <div class="rastro"></div>
  <button id="clique" type="button" aria-label="Clique aqui e deixe o trenzinho trazer seu convite"></button>

  <div id="trem" aria-hidden="true">
    <svg viewBox="0 0 1260 240" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="corpo" x1="0" y1="0" x2="0" y2="1">

        <radialGradient id="farol" cx=".5" cy=".5" r=".5">
          <stop offset="0" stop-color="#FFFFFF"/>

        </radialGradient>
        <g id="janelas">
          <rect x="0" y="0" width="54" height="46" rx="7" fill="url(#vidro)"/>
          <rect x="70" y="0" width="54" height="46" rx="7" fill="url(#vidro)"/>
          <rect x="140" y="0" width="54" height="46" rx="7" fill="url(#vidro)"/>
          <rect x="210" y="0" width="54" height="46" rx="7" fill="url(#vidro)"/>
        </g>
        <g id="truque">
          <rect x="0" y="0" width="110" height="16" rx="5" fill="#2A2F3D"/>
          <circle cx="28" cy="22" r="15" fill="#1B1F2A"/><circle cx="28" cy="22" r="6" fill="#9AA3B5"/>
          <circle cx="82" cy="22" r="15" fill="#1B1F2A"/><circle cx="82" cy="22" r="6" fill="#9AA3B5"/>
        </g>
        <g id="vagao">
          <rect x="0" y="30" width="400" height="160" rx="16" fill="url(#corpo)" stroke="#14224A" stroke-width="4"/>
          <rect x="4" y="150" width="392" height="22" fill="#14224A"/>
          <rect x="4" y="142" width="392" height="6" fill="#FFFFFF"/>

          <rect x="310" y="56" width="62" height="118" rx="6" fill="#FFF3C4" stroke="#14224A" stroke-width="3"/>
          <line x1="341" y1="58" x2="341" y2="172" stroke="#14224A" stroke-width="3"/>
          <rect x="316" y="66" width="20" height="40" rx="4" fill="url(#vidro)"/>
          <rect x="346" y="66" width="20" height="40" rx="4" fill="url(#vidro)"/>
          <use href="#truque" x="30" y="188"/>
          <use href="#truque" x="260" y="188"/>
        </g>
      </defs>

      <!-- pantógrafo -->
      <path d="M150 30 L190 6 L230 30 M170 6 H210" stroke="#14224A" stroke-width="4" fill="none" stroke-linecap="round"/>

      <!-- vagão líder com cabine (frente à esquerda) -->
      <path d="M40 190 C10 188 4 170 6 150 L20 92 C30 52 60 32 110 30 L440 30 Q456 30 456 46 L456 174 Q456 190 440 190 Z"
            fill="url(#corpo)" stroke="#14224A" stroke-width="4"/>
      <path d="M10 150 L452 150 L452 172 L28 172 C16 170 10 162 10 150 Z" fill="#14224A"/>
      <rect x="12" y="142" width="440" height="6" fill="#FFFFFF"/>
      <!-- para-brisa -->
      <path d="M28 104 C36 68 62 50 104 48 L134 48 L134 112 L30 112 Z" fill="url(#vidro)" stroke="#14224A" stroke-width="3"/>
      <path d="M44 96 C52 74 70 62 96 60" stroke="#FFFFFF" stroke-opacity=".55" stroke-width="5" fill="none" stroke-linecap="round"/>
      <!-- farol -->
      <ellipse cx="20" cy="132" rx="10" ry="7" fill="#FFFBE0" stroke="#14224A" stroke-width="2"/>
      <ellipse cx="-30" cy="132" rx="70" ry="26" fill="url(#farol)"/>
      <!-- janelas e porta do líder -->
      <use href="#janelas" x="160" y="62"/>
      <rect x="376" y="56" width="62" height="118" rx="6" fill="#FFF3C4" stroke="#14224A" stroke-width="3"/>
      <line x1="407" y1="58" x2="407" y2="172" stroke="#14224A" stroke-width="3"/>
      <rect x="382" y="66" width="20" height="40" rx="4" fill="url(#vidro)"/>
      <rect x="412" y="66" width="20" height="40" rx="4" fill="url(#vidro)"/>
      <!-- faixa com nome -->
      <image href="logo-trivia.png" x="190" y="111" width="124" height="30" preserveAspectRatio="xMidYMid meet"/>
      <use href="#truque" x="60" y="188"/>
      <use href="#truque" x="316" y="188"/>

      <!-- engates -->
      <rect x="456" y="120" width="14" height="30" fill="#2A2F3D"/>
      <use href="#vagao" x="470" y="0"/>
      <rect x="870" y="120" width="14" height="30" fill="#2A2F3D"/>
      <g transform="translate(884 0)">
        <rect x="0" y="30" width="370" height="160" rx="16" fill="url(#corpo)" stroke="#14224A" stroke-width="4"/>
        <rect x="4" y="150" width="362" height="22" fill="#14224A"/>
        <rect x="4" y="142" width="362" height="6" fill="#FFFFFF"/>
        <use href="#janelas" x="22" y="62"/>
        <path d="M366 60 L366 166" stroke="#14224A" stroke-width="4"/>
        <circle cx="352" cy="132" r="6" fill="#E53935"/>
        <use href="#truque" x="30" y="188"/>
        <use href="#truque" x="230" y="188"/>
      </g>
      <!-- logo nos vagões -->
      <image href="logo-trivia.png" x="500" y="111" width="124" height="30" preserveAspectRatio="xMidYMid meet"/>
      <image href="logo-trivia.png" x="920" y="111" width="124" height="30" preserveAspectRatio="xMidYMid meet"/>
    </svg>
  </div>

  <audio id="som" src="som-convite.mp3" preload="auto"></audio>
  <button id="rever" type="button">↺ Ver de novo</button>
</main>

<script>
(() => {
  const palco = document.getElementById('palco');
  const clique = document.getElementById('clique');
  const trem = document.getElementById('trem');
  const convite = document.getElementById('convite');
  const rever = document.getElementById('rever');
  const reduz = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let rodando = false;

  // Buzina de trem: acorde de 5 tons (estilo buzina ferroviária), com dois toques curtos,
  // leve queda de tom no final e eco de estação.
  function buzina() {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      const ctx = new AC();
      if (ctx.resume) ctx.resume();
      const t0 = ctx.currentTime + 0.02;

      const master = ctx.createGain();
      master.gain.value = 0.9;
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -18; comp.ratio.value = 4;
      master.connect(comp).connect(ctx.destination);

      // eco curto de plataforma
      const eco = ctx.createDelay(1); eco.delayTime.value = 0.14;
      const ecoGanho = ctx.createGain(); ecoGanho.gain.value = 0.28;
      const ecoFiltro = ctx.createBiquadFilter(); ecoFiltro.type = 'lowpass'; ecoFiltro.frequency.value = 1800;
      eco.connect(ecoFiltro).connect(ecoGanho).connect(eco);
      ecoGanho.connect(master);

      // "rouquidão" metálica da corneta
      const distorcao = ctx.createWaveShaper();
      const curva = new Float32Array(1024);
      for (let i = 0; i < 1024; i++) { const x = i / 512 - 1; curva[i] = Math.tanh(2.2 * x); }
      distorcao.curve = curva;

      const corpo = ctx.createBiquadFilter(); corpo.type = 'lowpass'; corpo.frequency.value = 2600; corpo.Q.value = 0.7;
      const envelope = ctx.createGain(); envelope.gain.value = 0.0001;
      envelope.connect(distorcao).connect(corpo);
      corpo.connect(master); corpo.connect(eco);

      // leve trêmulo, como o ar vibrando na corneta
      const lfo = ctx.createOscillator(); lfo.frequency.value = 5.5;
      const lfoGanho = ctx.createGain(); lfoGanho.gain.value = 0.025;
      lfo.connect(lfoGanho).connect(envelope.gain);

      const notas = [311.1, 370.0, 415.3, 493.9, 622.3];
      const fim = t0 + 1.15;
      const oscs = [];
      notas.forEach((f, i) => {
        [-6, 6].forEach(desafino => {
          const o = ctx.createOscillator();
          o.type = 'sawtooth';
          o.frequency.value = f;
          o.detune.value = desafino;
          const g = ctx.createGain(); g.gain.value = 0.11 - i * 0.012;
          o.connect(g).connect(envelope);
          oscs.push(o);
        });
      });

      // toques: dois toques curtos
      const toques = [[0, 0.35], [0.5, 0.6]];
      const nivel = 0.5;
      toques.forEach(([ini, dur]) => {
        const a = t0 + ini, b = a + dur;
        envelope.gain.setValueAtTime(0.0001, a);
        envelope.gain.exponentialRampToValueAtTime(nivel, a + 0.06);
        envelope.gain.setValueAtTime(nivel, b - 0.08);
        envelope.gain.exponentialRampToValueAtTime(0.0001, b);
        // ataque: a nota "sobe" até afinar, como o ar enchendo a corneta
        oscs.forEach(o => {
          o.detune.setValueAtTime(o.detune.value - 60, a);
          o.detune.linearRampToValueAtTime(o.detune.value, a + 0.09);
        });
      });
      // Doppler: o último toque cai de tom enquanto o trem passa
      oscs.forEach(o => {
        o.detune.setValueAtTime(o.detune.value, t0 + 0.8);
        o.detune.linearRampToValueAtTime(o.detune.value - 40, t0 + 1.1);
      });

      oscs.forEach(o => { o.start(t0); o.stop(fim); });
      lfo.start(t0); lfo.stop(fim);
      setTimeout(() => ctx.close(), 2000);
    } catch (e) {}
  }

  // Depois da buzina: voz gravada do convite
  const AC = window.AudioContext || window.webkitAudioContext;
  const VOZ_SRC = 'voz-convite.mp3';
  let avisoCtx = null, avisoNos = [], timersAviso = [], vozBuffer = null, vozPromessa = null;

  function prepararVoz() {
    if (!AC) return Promise.resolve(null);
    if (vozBuffer) return Promise.resolve(vozBuffer);
    if (vozPromessa) return vozPromessa;
    try { if (!avisoCtx) avisoCtx = new AC(); } catch (e) { return Promise.resolve(null); }
    vozPromessa = fetch(VOZ_SRC)
      .then(r => r.arrayBuffer())
      .then(b => new Promise((ok, erro) => avisoCtx.decodeAudioData(b, ok, erro)))
      .then(buf => (vozBuffer = buf))
      .catch(() => { vozPromessa = null; return null; });
    return vozPromessa;
  }

  function aviso(atraso) {
    cancelarAviso();
    if (!AC) return;
    // o contexto precisa ser liberado dentro do toque (iPhone/Android)
    try { if (!avisoCtx) avisoCtx = new AC(); if (avisoCtx.resume) avisoCtx.resume(); } catch (e) { return; }
    const inicio = avisoCtx.currentTime + atraso / 1000;
    const inicioVoz = inicio;   // a voz entra assim que a buzina termina
    prepararVoz().then(buf => {
      if (!buf) return;
      const fonte = avisoCtx.createBufferSource();
      fonte.buffer = buf;
      const g = avisoCtx.createGain(); g.gain.value = 1;
      fonte.connect(g).connect(avisoCtx.destination);
      fonte.start(Math.max(inicioVoz, avisoCtx.currentTime + 0.02));
      avisoNos.push(fonte);
    });
  }

  function cancelarAviso() {
    timersAviso.forEach(clearTimeout); timersAviso = [];
    avisoNos.forEach(o => { try { o.stop(); } catch (e) {} });
    avisoNos = [];
  }


  // Toque de estação: gongo de 3 notas (plim-plim-plom)
  function gongo(ctx, t0) {
    try {
      [[784.0, 0], [659.3, 0.42], [523.3, 0.84]].forEach(([f, ini]) => {
        [1, 2.76, 5.4].forEach((harm, k) => {
          const o = ctx.createOscillator();
          o.type = 'sine';
          o.frequency.value = f * harm;
          const g = ctx.createGain();
          const pico = [0.3, 0.07, 0.025][k];
          g.gain.setValueAtTime(0.0001, t0 + ini);
          g.gain.exponentialRampToValueAtTime(pico, t0 + ini + 0.01);
          g.gain.exponentialRampToValueAtTime(0.0001, t0 + ini + (k ? 0.6 : 1.6));
          o.connect(g).connect(ctx.destination);
          o.start(t0 + ini); o.stop(t0 + ini + 1.7);
          avisoNos.push(o);
        });
      });
    } catch (e) {}
  }

  // Áudio único (buzina + voz). Toca pelo player de áudio normal (<audio>), que no iPhone
  // funciona mesmo com a chave de silencioso ligada; se falhar, usa o Web Audio como reserva.
  const SOM_SRC = 'som-convite.mp3';
  const somEl = document.getElementById('som');
  let somCtx = null, somFonte = null;

  function tocarSom() {
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
    pararSom();
    try {
      somEl.currentTime = 0;
      somEl.volume = 1;
      const p = somEl.play();
      if (p && p.catch) p.catch(tocarWebAudio);
    } catch (e) { tocarWebAudio(); }
  }

  function tocarWebAudio() {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    try {
      somCtx = new Ctx();
      if (somCtx.resume) somCtx.resume();
      const ctx = somCtx;
      fetch(SOM_SRC).then(r => r.arrayBuffer()).then(b => {
        ctx.decodeAudioData(b, buf => {
          if (ctx !== somCtx) return;
          const f = ctx.createBufferSource();
          f.buffer = buf; f.connect(ctx.destination); f.start(0);
          somFonte = f;
        }, () => buzina());
      }).catch(() => buzina());
    } catch (e) { buzina(); }
  }

  function pararSom() {
    try { somEl.pause(); somEl.currentTime = 0; } catch (e) {}
    try { if (somFonte) somFonte.stop(); } catch (e) {}
    try { if (somCtx) somCtx.close(); } catch (e) {}
    somFonte = null; somCtx = null;
  }

  function partir() {
    if (rodando) return;
    rodando = true;
    palco.classList.add('saiu');
    tocarSom();

    if (reduz) {
      palco.classList.add('revelado');
      convite.style.clipPath = '';
      rodando = false;
      return;
    }

    palco.classList.add('passando');
    const W = palco.clientWidth;
    const L = trem.getBoundingClientRect().width;
    const dur = 2800;
    const t0 = performance.now();
    const ease = t => t < .5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2;

    function quadro(agora) {
      const p = Math.min(1, (agora - t0) / dur);
      const x = W - ease(p) * (W + L + 40);   // frente do trem
      trem.style.transform = `translateX(${x}px)`;
      const cauda = Math.max(0, Math.min(W, x + L - 20));
      convite.style.clipPath = `inset(0 0 0 ${cauda}px)`;
      if (p < 1) requestAnimationFrame(quadro);
      else {
        palco.classList.add('revelado');
        palco.classList.remove('passando');
        convite.style.clipPath = '';
        rodando = false;
      }
    }
    requestAnimationFrame(quadro);
  }

  function voltar() {
    cancelarAviso();
    pararSom();
    palco.classList.remove('revelado', 'saiu', 'passando');
    convite.style.clipPath = '';
    trem.style.transform = '';
    clique.focus();
  }

  clique.addEventListener('click', partir);
  rever.addEventListener('click', voltar);
})();
</script>

</body>
